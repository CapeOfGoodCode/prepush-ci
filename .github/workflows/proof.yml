name: proof

# The human merges on the proof (LOOP.md). A ready pull request without one is not reviewable.
# Separate from ci.yml so that editing the description re-runs only this.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:   # the queue needs the required check; the proof was checked on the pull request

permissions: {}

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: checked on the pull request
        if: github.event_name == 'merge_group'
        run: echo "The proof was checked on the pull request; the merge queue only needs this check to report."
      - name: the pull request carries a proof
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          proof=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk '/^## Proof/{on=1; next} /^## /{on=0} on' \
            | grep -v '^<!--.*-->$' | grep -v '^[[:space:]]*$' || true)
          if [ -z "$proof" ]; then
            echo "::error::The pull request description has no '## Proof' section with content. See LOOP.md, Proof."
            exit 1
          fi
          if printf '%s\n' "$proof" | grep -q -e '<criterion of the issue>' -e 'test_…' -e '^\$ …$'; then
            echo "::error::The Proof section still holds the template's placeholders. See LOOP.md, Proof."
            exit 1
          fi
          echo "Proof section present ($(printf '%s\n' "$proof" | wc -l) lines)."
