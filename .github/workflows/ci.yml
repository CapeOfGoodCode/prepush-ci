name: ci

# Pull requests run only once they are ready for review: drafts are work in progress. The human's
# approval merges through auto-merge; two pull requests that pass alone can still break together,
# so every push to main runs the full check again, Linux and Windows (the coverage badge too).
# Description edits do not trigger this workflow (proof.yml checks those), so an edit can never
# cancel a running check and leave a skipped, "passing" one behind.
# The ruleset requires ci-passed (and proof): a job added here is required without touching it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change can affect. Prose only (Markdown outside src/, skills/ and openspec/, except the
  # README; the issue templates): no checks. Specs but no code (openspec/): the fast check, which validates them.
  # Anything else, or a file list that cannot be read: everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      specs: ${{ steps.diff.outputs.specs }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true specs=false
          # The compare API lists at most 300 files; a longer list is treated as code.
          if [ "$EVENT" != push ] \
            && files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename') \
            && [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                openspec/*) specs=true ;;
                src/*|skills/*|README.md) code=true ;;   # README.md is the PyPI page; a spec checks its links
                *.md|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "changed files decide: code=$code specs=$specs"
          { echo "code=$code"; echo "specs=$specs"; } >> "$GITHUB_OUTPUT"

  # Both ends of requires-python: a user on 3.11 must not be the first to run code that needs 3.12.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: npm ci
      # The full check; the pre-push hook runs its --fast part.
      - run: sh scripts/ci
      - if: matrix.python == '3.14'   # one coverage report: the newest Python
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true

  # A change to specs and prose only: lint, types and the OpenSpec validation, no tests.
  specs:
    needs: changes
    if: needs.changes.outputs.code == 'false' && needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: sh scripts/ci --fast

  # The loops and CI run Linux, contributors also Windows: specs that hand paths to git or a shell
  # broke there twice (#26, #36) and only the human's pre-push hook noticed.
  check-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: sh scripts/ci

  # Write permissions live here, away from the job that runs the tests.
  coverage:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the badge goes to the action's data branch (main only)
      pull-requests: write   # the coverage comment on pull requests
    steps:
      # The coverage action pushes the badge to its data branch with these credentials; this job
      # runs no code from the pull request (only the downloaded report), so keeping them is safe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}

  # The one required check. Passes only when every job the change needs succeeded: a failed,
  # cancelled or skipped job the change needed fails it, so it can never pass by default.
  ci-passed:
    needs: [changes, specs, check, check-windows]
    if: always() && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SPECS: ${{ needs.changes.outputs.specs }}
          SPECS_RESULT: ${{ needs.specs.result }}
          RESULTS: ${{ needs.check.result }} ${{ needs.check-windows.result }}
        run: |
          echo "changes: $CHANGES, code: $CODE, tests: $RESULTS"
          [ "$CHANGES" = success ] || { echo "::error::could not tell what changed"; exit 1; }
          if [ "$CODE" = false ]; then
            if [ "$SPECS" = true ] && [ "$SPECS_RESULT" != success ]; then echo "::error::the specs check did not succeed"; exit 1; fi
            echo "no code changed: the test jobs were not needed"; exit 0
          fi
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job did not succeed: $RESULTS"; exit 1; }; done
