name: ci

# Pull requests run only once they are ready for review: drafts are work in progress. The merge
# queue runs everything again on the exact state that will land, so main is never tested after the
# fact; a push to main runs only the Linux check, for the coverage badge.
# Description edits do not trigger this workflow (proof.yml checks those), so an edit can never
# cancel a running check and leave a skipped, "passing" one behind.
# The ruleset requires ci-passed (and proof): a job added here is required without touching it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both ends of requires-python: a user on 3.11 must not be the first to run code that needs 3.12.
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    name: check (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: npm ci
      # The full check; the pre-push hook runs its --fast part.
      - run: sh scripts/ci
      - if: matrix.python == '3.14'   # one coverage report: the newest Python
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true

  # The loops and CI run Linux, contributors also Windows: specs that hand paths to git or a shell
  # broke there twice (#26, #36) and only the human's pre-push hook noticed.
  check-windows:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: sh scripts/ci

  # Write permissions live here, away from the job that runs the tests.
  coverage:
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the badge goes to the action's data branch (main only)
      pull-requests: write   # the coverage comment on pull requests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}

  # The one required check. Fails unless every job it needs succeeded: a failed, cancelled or
  # skipped dependency fails it, so it can never pass by default.
  ci-passed:
    needs: [check, check-windows]
    if: always() && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job did not succeed: $RESULTS"; exit 1; }; done
